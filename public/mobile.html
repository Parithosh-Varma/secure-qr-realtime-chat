<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Verify login — Secure Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--void:#0A0A0B; --card:#131318; --raised:#1C1D23; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.13); --txt:#ECECED; --mut:#9A9AA3; --dim:#6B6B74; --aura:#7AA2FF; --danger:#F4212E}
    *{box-sizing:border-box}
    body{margin:0; background:var(--void); color:var(--txt); font-family:"Inter",system-ui,sans-serif; font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
    :focus-visible{outline:2px solid var(--aura); outline-offset:2px}
    .mono{font-family:"JetBrains Mono",monospace}
    .top{position:sticky; top:0; background:rgba(10,10,11,.8); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
    .top-inner{max-width:520px; margin:0 auto; padding:13px 18px; display:flex; align-items:center; gap:12px}
    .back{border:1px solid var(--line); color:var(--txt); width:32px; height:32px; border-radius:10px; display:grid; place-items:center; text-decoration:none}
    .top-inner b{font-family:"Inter Tight",sans-serif; font-size:14.5px}
    .wrap{max-width:520px; margin:0 auto; padding:22px 18px 120px}
    h1{margin:0; font-family:"Inter Tight",sans-serif; font-size:30px; font-weight:600; letter-spacing:-.04em; line-height:1.05}
    h1 em{font-style:normal; color:var(--mut); font-weight:500}
    .sub{margin:10px 0 0; color:var(--mut); font-size:13.5px}
    .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin:14px 0}
    .card h2{margin:0 0 10px; font-size:14px; font-family:"Inter Tight",sans-serif}
    input[type=text]{width:100%; background:var(--void); border:1px solid var(--line); color:var(--txt); border-radius:12px; padding:12px 13px; font-size:14px; outline:none}
    input:focus{border-color:rgba(122,162,255,.5)}
    .row{display:flex; gap:8px; margin-top:10px}
    .btn{border:0; border-radius:12px; padding:12px 14px; font-size:14px; font-weight:600; cursor:pointer}
    .btn-primary{background:#fff; color:#000; flex:1}
    .btn-quiet{background:transparent; color:var(--txt); border:1px solid var(--line-2); font-weight:500}
    .btn-danger{background:var(--danger); color:#fff; flex:1}
    .btn:disabled{opacity:.4}
    .note{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--mut); margin:10px 0 0; white-space:pre-wrap}
    #confirm{display:none; border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:14px; margin-top:12px}
    #confirm.open{display:block}
    #details{margin:0 0 4px; padding-left:18px; font-size:13px; color:var(--txt)}
    #details li{margin:5px 0}
    .check{display:flex; gap:10px; align-items:flex-start; margin:12px 0}
    .check input{width:18px; height:18px; accent-color:#fff}
    .check label{font-size:13px}
    .dock{position:fixed; bottom:0; left:0; right:0; background:rgba(10,10,11,.88); backdrop-filter:blur(14px); border-top:1px solid var(--line); padding:12px 18px calc(14px + env(safe-area-inset-bottom))}
    .dock-inner{max-width:520px; margin:0 auto; display:flex; gap:8px}
  </style>
</head>
<body>
  <header class="top"><div class="top-inner"><a class="back" href="/desktop" aria-label="Back">←</a><b>Verify login</b></div></header>
  <div class="wrap">
    <h1>Is this you<br><em>trying to link?</em></h1>
    <p class="sub">Check it matches your desktop, then approve. The ticket burns instantly.</p>

    <section class="card">
      <h2>1 · Your session</h2>
      <input id="userId" type="text" value="alice" autocomplete="off" aria-label="User id" />
      <div class="row"><button id="login" class="btn btn-primary">Mint session</button></div>
      <p class="note" id="loginOut">No session yet.</p>
    </section>

    <section class="card">
      <h2>2 · The ticket</h2>
      <input id="token" type="text" placeholder="Paste token" autocomplete="off" aria-label="Token" />
      <div class="row">
        <button id="paste" class="btn btn-quiet" type="button">Paste</button>
        <button id="preview" class="btn btn-primary">Inspect</button>
      </div>
      <p class="note" id="previewOut">Awaiting token…</p>
      <div id="confirm" role="dialog" aria-labelledby="confirmTitle">
        <ul id="details"></ul>
        <div class="check"><input id="ack" type="checkbox" /><label for="ack">I started this login and the time looks right.</label></div>
      </div>
    </section>
  </div>
  <div class="dock" id="dock" style="display:none"><div class="dock-inner">
    <button id="deny" class="btn btn-quiet" style="flex:1; color:#FF8585">Deny</button>
    <button id="approve" class="btn btn-primary" disabled>Approve</button>
  </div></div>
  <script type="module" src="/client/mobile.js"></script>
</body>
</html>
