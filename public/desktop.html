<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure Chat — private</title>
  <link rel="icon" type="image/png" sizes="256x256" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" media="(prefers-color-scheme: dark)" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <script src="/client/qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; background:#0A0A0B; color:#ECECED; font-family:"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased}
    .qr-view{min-height:100dvh; display:grid; place-items:center; padding:24px}
    .qr-card{width:min(360px,100%); text-align:center}
    #qr{width:320px; height:320px; margin:0 auto; background:#fff; border-radius:20px; padding:16px; display:grid; place-items:center}
    #qr canvas,#qr svg,#qr img{border-radius:12px; display:block; width:288px; height:288px}
    #qr .empty{color:#6B6B74; font-size:13px}
    .qr-card h1{margin:18px 0 0; font-family:"Inter Tight",sans-serif; font-size:18px; font-weight:600}
    .share-btn{margin-top:14px; border:1px solid rgba(255,255,255,.13); background:transparent; color:#ECECED; border-radius:99px; font-size:12.5px; font-weight:600; padding:8px 16px; cursor:pointer}
    .share-btn:disabled{opacity:.35; cursor:default}
    .share-hint{margin:8px 0 0; color:#6B6B74; font-size:11.5px}
    .hide{display:none !important}
    /* chat — hidden until connected */
    .app{display:grid; grid-template-columns:220px 1fr; height:100dvh}
    .side{background:#101014; border-right:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column}
    .side-top{padding:14px 12px 6px}
    .logo{display:flex; gap:10px; align-items:center; padding:2px 6px}
    .mark{width:30px; height:30px; border-radius:50%; background:#fff; color:#000; display:grid; place-items:center; font-weight:700}
    .mark-img{width:30px; height:30px; border-radius:8px; object-fit:cover; display:block; background:#000}
    .logo b{font-family:"Inter Tight",sans-serif; font-size:14px}
    .side-foot{border-top:1px solid rgba(255,255,255,.08); padding:12px; margin-top:auto}
    .user-card{display:flex; gap:10px; align-items:center; background:#0A0A0B; border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:9px 10px}
    .avatar{width:30px; height:30px; border-radius:50%; background:#1C1D23; display:grid; place-items:center; font-size:12px}
    .who{flex:1; min-width:0}
    .who b{display:block; font-size:13px}
    .who span{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:#9A9AA3}
    .link-btn{border:1px solid rgba(255,255,255,.08); background:transparent; color:#ECECED; border-radius:8px; font-size:12px; padding:6px 10px; cursor:pointer}
    .main{display:flex; flex-direction:column; min-width:0}
    .topbar{height:56px; display:flex; align-items:center; gap:10px; padding:0 20px; border-bottom:1px solid rgba(255,255,255,.08); background:rgba(10,10,11,.72)}
    .room-pill{font-family:"Inter Tight",sans-serif; font-weight:600}
    .primary-btn{border:0; background:#fff; color:#000; font-weight:600; border-radius:11px; padding:9px 15px; cursor:pointer}
    .scroll{flex:1; overflow:auto}
    .col{max-width:760px; margin:0 auto; padding:0 24px; width:100%}
    #msgs{display:flex; flex-direction:column; gap:2px; padding:26px 0 18px}
    .sys{text-align:center; color:#6B6B74; font-family:"JetBrains Mono",monospace; font-size:11px; padding:10px}
    .row{display:flex; gap:12px; padding:11px 8px; border-radius:14px}
    .row.me{flex-direction:row-reverse}
    .row .ava{width:30px; height:30px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center; font-weight:600; background:#26272E; border:1px solid rgba(255,255,255,.08)}
    .row.me .ava{display:none}
    .bubble{max-width:min(78%,560px)}
    .row.me .bubble{background:#26272E; border:1px solid rgba(255,255,255,.08); border-radius:18px 18px 5px 18px; padding:10px 14px; margin-left:auto}
    .meta{display:flex; gap:8px; align-items:baseline}
    .meta b{font-size:13px}
    .meta time{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:#6B6B74}
    .body{font-size:14.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word}
    .presence{display:none; width:fit-content; margin:0 auto 6px; font-family:"JetBrains Mono",monospace; font-size:11px; color:#9A9AA3; border:1px solid rgba(255,255,255,.08); background:#101014; border-radius:99px; padding:5px 12px}
    .typing{display:none; width:fit-content; margin:0 auto 6px; font-size:12px; color:#9A9AA3; border:1px solid rgba(255,255,255,.08); background:#101014; border-radius:99px; padding:5px 12px}
    .typing b{color:#ECECED; font-weight:600}
    .typing .dots::after{content:""; animation:tdots 1.2s infinite}
    @keyframes tdots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
    @media (prefers-reduced-motion:reduce){.typing .dots::after{content:"..."; animation:none}}
    .composer{border:1px solid rgba(255,255,255,.13); background:#131318; border-radius:26px; padding:0}
    #msgInput{width:100%; background:transparent; border:0; outline:0; color:#ECECED; font:inherit; font-size:14.5px; padding:15px 18px; display:block}
    .composer-bar{display:flex; align-items:center; padding:0 10px 10px 18px}
    .send{border:0; width:34px; height:34px; border-radius:50%; background:#fff; color:#000; display:grid; place-items:center; cursor:pointer}
    .send:disabled{opacity:.4}
    .toast-stack{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px}
    .toast{background:#26272E; border:1px solid rgba(255,255,255,.13); border-radius:12px; padding:10px 14px; font-size:13px}
    .spin{display:inline-block; width:12px; height:12px; flex:0 0 auto; border-radius:50%; border:2px solid rgba(255,255,255,.2); border-top-color:#fff; animation:spin .8s linear infinite; vertical-align:-2px; margin-right:7px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.spin{animation:none; border-top-color:rgba(255,255,255,.2)}}
    .qr-card .spin{border-color:rgba(0,0,0,.15); border-top-color:#000}
    .conn{display:none; width:fit-content; margin:0 auto 6px; font-size:12px; color:#9A9AA3; border:1px solid rgba(255,255,255,.08); background:#101014; border-radius:99px; padding:5px 12px}
    .row.pending{opacity:.75}
    .pstat{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:#6B6B74; margin-top:4px}
    .row.failed .pstat{color:#FF8585}
    .pstat.tick{color:#9A9AA3}
    :root{--ink:#101820;--paper:#f4f7f5;--panel:#ffffff;--muted:#64727b;--line:#dbe5e1;--accent:#0b7a75;--accent-soft:#dff3ed;--dark:#173b3a;--shadow:0 18px 50px rgba(16,24,32,.10)}
    body{background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .qr-view{background:radial-gradient(circle at 50% 18%,#e5f4ed 0,transparent 34%),var(--paper);padding:32px}
    .qr-card{width:min(440px,100%);background:rgba(255,255,255,.84);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow)}
    .qr-card:before{content:'PRIVATE ROOM';display:block;text-align:left;color:var(--accent);font:700 10px/1 JetBrains Mono,monospace;letter-spacing:.16em;margin-bottom:22px}
    #qr{width:min(340px,100%);height:auto;aspect-ratio:1;background:#fff;border:10px solid #fff;border-radius:20px;box-shadow:0 8px 24px rgba(16,24,32,.08);padding:10px}
    #qr canvas,#qr svg,#qr img{width:100%;height:100%;border-radius:8px}
    .qr-card h1{color:var(--ink);font-size:22px;letter-spacing:-.03em;margin-top:22px}
    .share-btn{color:var(--accent);border-color:#b9d9d1;background:var(--accent-soft);padding:10px 16px}
    .share-hint{color:var(--muted);font-size:12px}
    .app{grid-template-columns:264px 1fr;background:var(--paper)}
    .side{background:var(--dark);border-right:0;color:#eff8f4}
    .side-top{padding:22px 18px 12px}.logo{padding:4px 8px}.logo b{font-size:15px;letter-spacing:-.02em}.mark-img{border-radius:10px}
    .side-foot{border-color:rgba(255,255,255,.12);padding:16px}.user-card{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.13);padding:11px}.who b{color:#fff}.who span{color:#a9c0ba}.avatar{background:#2d6059}.link-btn{color:#dff3ed;border-color:rgba(255,255,255,.18)}
    .main{background:var(--paper)}.topbar{height:72px;background:rgba(244,247,245,.9);border-color:var(--line);padding:0 32px}.room-pill{color:var(--dark);font-size:15px}.room-pill:before{content:'●';color:var(--accent);font-size:11px;margin-right:8px}.primary-btn{background:var(--accent);color:#fff;border-radius:10px;padding:10px 17px;box-shadow:0 5px 14px rgba(11,122,117,.2)}
    .col{max-width:850px}.sys,.conn,.presence,.typing{color:var(--muted);background:var(--panel);border-color:var(--line)}#msgs{padding-top:32px}.row{padding:13px 10px}.row .ava{background:var(--accent-soft);color:var(--accent);border:0}.row.me .bubble{background:var(--dark);border:0;color:#f4fbf8;padding:12px 16px}.meta b{color:var(--ink)}.row.me .meta b{color:#fff}.meta time{color:var(--muted)}.body{font-size:15px}
    .composer{background:var(--panel);border-color:var(--line);box-shadow:0 10px 30px rgba(16,24,32,.08)}#msgInput{color:var(--ink);padding:16px 18px}.send{background:var(--accent);color:#fff}.toast{background:var(--dark);border:0;color:#fff}
    @media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.topbar{padding:0 16px;height:60px}.col{padding:0 14px}.qr-card{padding:22px}.qr-view{padding:18px}}
  </style>
</head>
<body>
  <!-- QR only -->
  <div id="qrView" class="qr-view">
    <div class="qr-card">
      <div><button id="qrBack" type="button" style="display:none;margin:0 auto 12px;border:1px solid rgba(0,0,0,.18);background:transparent;color:#0A0A0B;border-radius:99px;font-size:12.5px;font-weight:600;padding:8px 16px;cursor:pointer">← Back to chat</button></div>
      <div id="qr"><div class="empty"><span class="spin" aria-hidden="true"></span>Generating…</div></div>
      <h1>Scan QR from other device</h1>
      <div><button class="share-btn" id="copyLinkBtn" disabled>⧉ Copy invite link</button></div>
      <p class="share-hint">No camera? Open the link in any desktop browser to join.</p>
      <div id="status" class="hide"></div><div id="timerText" class="hide"></div><div id="linkWrap" class="hide"><code id="link"></code></div><div id="ringNum" class="hide"></div><div id="ringFg" class="hide"></div>
    </div>
  </div>

  <!-- Chat — hidden until scanned + connected (2-person) -->
  <div id="chatView" class="app hide">
    <aside class="side">
      <div class="side-top"><div class="logo"><img src="/logo.png" alt="Secure Chat logo" class="mark-img" width="30" height="30" /><b>Secure Chat</b></div></div>
      <div class="side-foot"><div class="user-card"><div class="avatar" id="avatar">?</div><div class="who"><b id="me">—</b><span id="meSub">ephemeral</span></div><button class="link-btn" id="linkDeviceBtn">Invite</button></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="room-pill">Private · 2-person · E2E</div><div style="margin-left:auto"><button class="primary-btn" id="openQrBtn">Invite</button></div></header>
      <div class="scroll" id="scroll"><div class="col"><div id="presence"></div><div id="typing" class="typing" role="status" aria-live="polite"></div><div id="conn" class="conn" role="status" aria-live="polite"></div><div id="msgs" role="log" aria-live="polite"></div></div></div>
      <div style="padding:6px 0 10px; background:linear-gradient(180deg, transparent, #0A0A0B 30%)"><div class="col"><div class="composer"><textarea id="msgInput" rows="1" placeholder="Message" maxlength="2000"></textarea><div class="composer-bar"><span style="flex:1"></span><button class="send" id="send" aria-label="Send" disabled>↑</button></div></div></div></div>
    </main>
  </div>

  <div id="qrModal" class="hide"></div><div id="hero" class="hide"></div><div id="debug" class="hide"></div><div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
  <div class="hide"><span id="roomName"></span><span id="gen"></span><span id="heroLinkBtn"></span><span id="qrClose"></span><span id="menuBtn"></span><span id="newChatBtn"></span></div>
  <script src="/config.js?v=6"></script>
  <script type="module" src="/client/desktop.js?v=8"></script>
</body>
</html>
